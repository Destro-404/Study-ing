    const contenedor = document.getElementById('lista-libros');
    const inputBusqueda = document.getElementById('busqueda');

    function mostrarLibros(lista) {
      contenedor.innerHTML = '';
      lista.forEach(libro => {
        contenedor.innerHTML += `
          <div class="libro">
            <h3>${libro.titulo}</h3>
            <p><strong>Autor:</strong> ${libro.autor}</p>
            <p><strong>Género:</strong> ${libro.genero}</p>
            <a href="${libro.enlace}" target="_blank">
              <button class="ver-btn">📖 Ver recurso</button>
            </a>
          </div>
        `;
      });
    }

    function mostrarTodos() {
      mostrarLibros(libros);
    }

    function filtrarGenero(genero) {
      const filtrados = libros.filter(libro => libro.genero === genero);
      mostrarLibros(filtrados);
    }

    inputBusqueda.addEventListener('input', () => {
      const texto = inputBusqueda.value.toLowerCase();
      const filtrados = libros.filter(libro =>
        libro.titulo.toLowerCase().includes(texto) || libro.autor.toLowerCase().includes(texto)
      );
      mostrarLibros(filtrados);
    });

    function toggleMenu() {
      const menu = document.getElementById('navMenu');
      menu.classList.toggle('active');
      document.querySelector('.menu-toggle').classList.toggle('active');
    }

    mostrarTodos();
