<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compra Segura</title>
  <link rel="stylesheet" href="estiloss.css" />
</head>
<body>
  <img src="logo.png" alt="Logo" class="logo" />
  
  <div class="formulario-container">
    <form action="confirmar.html" method="GET" class="formulario">
      <h2>Detalles de Pago</h2>
      <label for="nombre">Nombre en la Tarjeta</label>
      <input type="text" id="nombre" name="nombre" required />
      
      <label for="numero">Número de Tarjeta</label>
      <input type="text" id="numero" name="numero" maxlength="16" required />
      
      <label for="expiracion">Fecha de Expiración</label>
      <input type="text" id="expiracion" name="expiracion" placeholder="MM/AA" required />
      
      <label for="cvv">CVV</label>
      <input type="text" id="cvv" name="cvv" maxlength="4" required />
      
      <button type="submit">Confirmar Compra</button>
    </form>
  </div>
</body>
</html>
