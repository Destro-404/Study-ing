<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login | Study-ing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #003366, #ff0000); /* azul y rojo */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 300px;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #003366;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background-color: #ff0000;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-button:hover {
      background-color: #cc0000;
    }

    .error-message {
      color: red;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Iniciar Sesión</h2>
    <input type="text" id="username" placeholder="Usuario" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button class="login-button" onclick="login()">Entrar</button>
    <div id="errorMsg" class="error-message">Usuario o contraseña incorrectos.</div>
  </div>

  <script>
    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (username === 'admin' && password === '1234') {
        localStorage.setItem('loggedInUser', username); // Guarda usuario
        window.location.href = 'index.html'; // Redirige
      } else {
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
