<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla de Bienvenida</title>
  <style>
    /* Fondo GIF */
    body {
      margin: 0;
      padding: 0;
      background: url('Mac.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Botón */
    .boton-continuar {
      padding: 15px 40px;
      background-color: #40e0d0; /* Turquesa */
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
    }

    .boton-continuar:hover {
      background-color: #2ecdbd;
      transform: scale(1.05);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <a href="https://drive.google.com/file/d/1SAhMzPM2uiNh3eoxw8QJT4JGkvnj9cbR/view?usp=drivesdk" class="boton-continuar">Continuar</a>
</body>
</html>
